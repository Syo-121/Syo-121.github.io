name: サイトを公開する

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 予約投稿（D-052）: 先頭情報の published が未来の記事はビルドから外れるので、
  # 毎日ビルドし直して、その日が来たら自動で出るようにする。cron は UTC なので 3:00 = 12:00 JST。
  # ⚠ GitHub の定期実行は数分〜数十分遅れる。60日間リポジトリに動きがないと自動で止まる（警告メールが来る）
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は1つずつ。走っているものは止めない
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      # 版は package-lock.json のまま入れる（勝手に上がらない）
      - name: Hugo と Pagefind を入れる
        run: npm ci

      # hugo でビルドし、pagefind で検索の索引を作る
      - name: ビルドと検索の索引づくり
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
